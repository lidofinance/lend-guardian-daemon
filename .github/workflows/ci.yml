name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read pinned Foundry version
        id: foundryref
        run: echo "version=$(cat .foundryref)" >> "$GITHUB_OUTPUT"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundryref.outputs.version }}

      - name: Verify Anvil
        run: anvil --version

      - name: Install dependencies
        run: npm ci

      - name: Run audit gate
        run: npm run check

      - name: Verify clean package installation
        run: npm run check:package

  images:
    # Fork PRs cannot read the Docker Hub pull token.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [daemon, monitoring]
    defaults:
      run:
        shell: bash
    env:
      COMPONENT: ${{ matrix.component }}
      IMAGE: guardian-${{ matrix.component }}:check
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to paid Docker Hardened Images
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: docker.io
          username: ${{ vars.DHI_USERNAME || secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build image without publishing
        run: |
          docker build --pull -f "$COMPONENT/Dockerfile" -t "$IMAGE" \
            --build-arg BUILD_VERSION=check \
            --build-arg BUILD_BRANCH="$GITHUB_HEAD_REF" \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" .

      - name: Check hardened runtime and build metadata
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --entrypoint node "$IMAGE" \
            --input-type=module -e '
              import assert from "node:assert/strict";
              import { existsSync, readFileSync } from "node:fs";
              assert.equal(process.getuid(), 1000);
              assert.equal(existsSync("/bin/sh"), false);
              const info = JSON.parse(readFileSync("/app/build-info.json", "utf8"));
              assert.equal(info.version, "check");
              assert.match(info.commit, /^[0-9a-f]{40}$/);
            '

      - name: Run daemon observe cycle with scripted services
        if: matrix.component == 'daemon'
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD/tests,dst=/app/tests,readonly" \
            -e MODE=observe \
            -e RPC_URLS=http://rpc.invalid \
            -e GUARDIAN=0x7e5f4552091a69125d5dfcb7b8c2659029395bdf \
            -e LIDO_LEND=0x00000000000000000000000000000000000000bb \
            -e LIDO_LEND_DEPLOYMENT_BLOCK=1000 \
            -e GUARDIAN_SIGNALS=0x00000000000000000000000000000000000000aa \
            -e GUARDIAN_SIGNALS_DEPLOYMENT_BLOCK=900 \
            -e SCREENING_URL=http://screening.invalid/screen \
            -e EVENTS_URL=http://receiver.invalid/events \
            --entrypoint node "$IMAGE" --experimental-test-module-mocks \
            tests/daemon/fixtures/run-daemon.ts observe | tee /tmp/daemon-smoke.log
          grep -q '^Health: 200$' /tmp/daemon-smoke.log
          grep -q '"kind":"observed"' /tmp/daemon-smoke.log

      - name: Check monitoring startup and HTTP endpoints
        if: matrix.component == 'monitoring'
        run: |
          container=$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges "$IMAGE")
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          docker exec "$container" node --input-type=module -e '
            import assert from "node:assert/strict";
            import { setTimeout } from "node:timers/promises";
            let healthy = false;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                healthy = (await fetch("http://127.0.0.1:9464/health")).ok;
              } catch {}
              if (healthy) break;
              await setTimeout(1000);
            }
            assert.equal(healthy, true);
            assert.equal((await fetch("http://127.0.0.1:9464/ready")).status, 503);
            const metrics = await fetch("http://127.0.0.1:9464/metrics");
            assert.equal(metrics.status, 200);
            assert.match(await metrics.text(), /lido_lend_guardian_monitor_build_info/);
          '

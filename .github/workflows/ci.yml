name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Read pinned Foundry version
        id: foundryref
        run: echo "version=$(cat .foundryref)" >> "$GITHUB_OUTPUT"

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ steps.foundryref.outputs.version }}

      - name: Verify Anvil
        run: anvil --version

      - name: Install dependencies
        run: npm ci

      - name: Run audit gate
        run: npm run check

      - name: Verify clean package installation
        run: npm run check:package

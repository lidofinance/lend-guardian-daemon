name: Build and push lido-lend-guardian-daemon to dev

run-name: Build and push lido-lend-guardian-daemon:dev to dev

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "benchmarks/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  build-and-push:
    uses: lidofinance/actions/.github/workflows/k8s-build-push-harbor.yml@c7b5b6c5d8013046347d728d748fa741eb214e28
    with:
      tag: dev
      registry: registry.dev.k8s-dev.org
      registry_username: ${{ vars.REGISTRY_USERNAME }}
      image: team-lend/lido-lend-guardian-daemon
      environment: harbor_dev_release
      dockerfile: daemon/Dockerfile
    secrets:
      registry_token: ${{ secrets.HARBOR_DEV_TOKEN }}
